[project]
name = "ltimockserver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Till Burdorf", email = "burdorftill@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
ltimockserver = "ltimockserver:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
